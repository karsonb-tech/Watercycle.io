<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Kar and Evt project</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="topheader" class="topcontent">
      <h1 id="title" class="topcontent"><strong>Water Cycle Clicker</strong></h1>
      <p id="vps" class="topcontent">0 Vapor Per Second</p>
      <p id="vapor" class="topcontent">0 Vapor</p>
      <button id="achevments" class="topcontent">Achevments</button>
      <button onclick=window.location.href="mainmenu.html">home</button>
      <button id="rebirth">Rebirth</button>
    </div>
    <div id="maincontent">
      <div id="achevmentssidebar">
        <div id="a1" class="achevments"></div>
      </div>
      <button id="clicker">Level 1</button>
      <div id="shop" class="shop">
        <button id="upgrade_1" class="upgrades button">
          <p id="1_name" class="name">Lower <strong>Humidity</strong></p>
          <p id="1_cost" class="cost">Cost: <strong>25 Water Vapor</strong></p> 
        </button>
        <button id="upgrade_2" class="upgrades button">
          <p id="2_name" class="name">More <strong>Surface Area</strong></p>
          <p id="2c" class="cost"> cost:100</p>
        </button>
        <button id="upgrade_3" class="upgrades">
          <p id="3n" class="name">stronger <strong>Wind</strong></p>
          <p id="3c" class="cost">cost: 500</p>
        </button>
        <button id="upgrade_4" class="upgrades">
            <p id="4n" class="name"> Higher <strong>Temperature</strong></p>
            <p id="4c" class="cost"> Cost: 15000 </p>
        </button>
        <button id="upgrade_5" class="upgrades">
            <p id="5n" class="name"> better <strong>leaves</strong></p>
            <p id="5c" class="cost"> cost: 500,000 </p>
        </button>
        <button id="upgrade_6" class="upgrades">
            <p id="6n" class="name"> get <strong>more leaves</strong></p>
            <p id="6c" class="cost"> cost: 750,000</p>
        </button>
        <button id="upgrade_7" class="upgrades">
          <p id="7n" class="name"> 2x <strong> transpiration speed</strong> </p>
          <p id="7c" class="cost"> cost: 1,000,000</p>
        </button>
        <button id="upgrade_8" class="upgrades">
          <p id="8n" class="name">idk</p>
        </button>
      </div>
    </div>
    <script src="clicker.js" defer></script>
  </body>
</html>
